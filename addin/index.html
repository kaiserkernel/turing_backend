<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PGT SEE</title>
<!--
  No <style> block here: MyGeotab strips <head> content when it injects this
  page's HTML/JS into its own document, so CSS declared here never survives.
  Styling is injected from JavaScript instead - see the top of addin.js.
-->
</head>
<body>
  <div id="turingCameras">
    <div class="tc-toolbar">
      <span class="tc-title">PGT SEE</span>
      <div class="tc-toolbar-actions">
        <a id="tcDashboardLink" class="tc-btn" href="#" target="_blank" rel="noopener noreferrer">Full Vision Dashboard</a>
        <button id="tcRefresh" class="tc-btn" type="button">Refresh</button>
      </div>
    </div>
    <div class="tc-controls">
      <div class="tc-toggle" id="tcViewToggle">
        <button type="button" class="tc-toggle-btn" data-view="single">Main camera</button>
        <button type="button" class="tc-toggle-btn" data-view="all">All cameras</button>
      </div>
      <div class="tc-toggle" id="tcLayoutToggle" hidden>
        <button type="button" class="tc-toggle-btn" data-layout="grid">Grid</button>
        <button type="button" class="tc-toggle-btn" data-layout="list">List</button>
      </div>
    </div>
    <div id="tcStatus" class="tc-status"></div>
    <div id="tcGrid" class="tc-grid"></div>
    <div id="tcAllView" class="tc-all-view" hidden></div>
  </div>

  <script src="vendor/hls.min.js"></script>
  <script src="addin.js"></script>
</body>
</html>
